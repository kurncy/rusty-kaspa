[package]
name = "kaspa-rpc-core"
description = "Kaspa RPC core"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[features]
wasm32-sdk = [
    "kaspa-consensus-client/wasm32-sdk",
    "kaspa-consensus-wasm/wasm32-sdk",
    "dep:kaspa-consensus-client",
    "dep:kaspa-consensus-wasm",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
    "dep:workflow-core",
    "dep:workflow-wasm",
]

[dependencies]
kaspa-addresses.workspace = true
kaspa-consensus-core.workspace = true
# Make wasm/client crates optional by default (enabled via wasm32-sdk feature)
kaspa-consensus-client = { workspace = true, optional = true }
kaspa-consensus-notify.workspace = true
kaspa-consensus-wasm = { workspace = true, optional = true }
kaspa-core.workspace = true
kaspa-hashes.workspace = true
kaspa-index-core.workspace = true
kaspa-math.workspace = true
kaspa-mining-errors.workspace = true
kaspa-notify.workspace = true
kaspa-txscript.workspace = true
kaspa-utils.workspace = true
kaspa-rpc-macros.workspace = true

async-channel.workspace = true
async-trait.workspace = true
borsh.workspace = true
cfg-if.workspace = true
derive_more.workspace = true
downcast.workspace = true
faster-hex.workspace = true
hex.workspace = true
# wasm-related dependencies optional by default
js-sys = { workspace = true, optional = true }
log.workspace = true
paste.workspace = true
rand.workspace = true
serde-wasm-bindgen = { workspace = true, optional = true }
serde.workspace = true
smallvec.workspace = true
thiserror.workspace = true
uuid.workspace = true
wasm-bindgen = { workspace = true, optional = true }
workflow-core = { workspace = true, optional = true }
workflow-serializer = { workspace = true }
workflow-wasm = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
